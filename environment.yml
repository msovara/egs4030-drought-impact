# EGS4030/5030S drought impact modelling: conda environment
#
# Create with (from the repository root, inside WSL with miniforge):
#   conda env create -f environment.yml
#   conda activate impact
#
# All packages come from conda-forge; "nodefaults" stops conda falling back to
# the Anaconda defaults channel even if a student's .condarc lists it.

name: impact

channels:
  - conda-forge
  - nodefaults

dependencies:
  # Matches runtime.txt / .python-version
  - python=3.12

  # Model, ERA5 files and dashboard (mirrors requirements.txt)
  - numpy>=1.24,<3
  - pandas>=2.0,<3
  - scipy>=1.10,<2
  - xarray>=2023.6
  - netcdf4>=1.6
  - streamlit>=1.30
  - plotly>=5.18
  - jinja2>=3.1          # pandas Styler, used for the dashboard tables

  # Figure templates, and maps if students want them
  - matplotlib>=3.8
  - cartopy>=0.22

  # Only needed to re-download ERA5 (lecturer); 0.7.2+ for the current CDS
  - cdsapi>=0.7.2
